name: S7 Coverage CI Reservaciones

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: S7-Coverage-CI-Reservaciones

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: S7-Coverage-CI-Reservaciones/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: S7-Coverage-CI-Reservaciones/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: S7-Coverage-CI-Reservaciones/coverage/
          if-no-files-found: error
